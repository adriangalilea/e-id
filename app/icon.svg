<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- e-id's logo: the mark (lib/mark, MARK_PATH, on its 24 grid) white on a disc
       of glass, the seal's shape. A favicon blurs nothing behind it, so the glass
       is drawn as its parts: a dark body lit from the top left, and the rim
       catching that light at the side facing it and fading round. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a2d"/>
      <stop offset="0.55" stop-color="#151517"/>
      <stop offset="1" stop-color="#0c0c0d"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#body)"/>
  <circle cx="32" cy="32" r="31.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <path transform="translate(12 12) scale(1.6667)" fill="#f5f5f5" d="M7.5 7.5a4.5 4.5 0 1 1 9 0a4.5 4.5 0 1 1 -9 0z M4.3 22Q3 22 3.05 21.1A9 8.5 0 0 1 20.95 21.1Q21 22 19.7 22z"/>
</svg>
